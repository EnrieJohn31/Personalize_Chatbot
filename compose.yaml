name: assistant-foundation

services:
    laravel.test:
        build:
            context: ./docker/php
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: assistant-foundation-php:8.4.27
        init: true
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:8000'
            - '127.0.0.1:${VITE_PORT:-5173}:5173'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            PHP_CLI_SERVER_WORKERS: 4
            VITE_PORT: '${VITE_PORT:-5173}'
            VITE_USE_POLLING: '${VITE_USE_POLLING:-true}'
        volumes:
            - '.:/var/www/html'
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '--fail',
                    '--silent',
                    'http://localhost:8000/up',
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 20s
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            agent:
                condition: service_healthy

    agent:
        build:
            context: ./agent-service
            dockerfile: Dockerfile.dev
            additional_contexts:
                contracts: ./contracts
        image: assistant-foundation-agent:dev
        init: true
        environment:
            PORT: 3101
            CHOKIDAR_USEPOLLING: '${VITE_USE_POLLING:-true}'
            # Without a key the run endpoints stay closed (503); setup.ps1 generates one in .env.
            AGENT_REQUEST_SIGNING_KEY: '${AGENT_REQUEST_SIGNING_KEY:-}'
            # Development only: admits the deterministic simulated provider.
            AGENT_SIMULATION_ENABLED: '${AGENT_SIMULATION_ENABLED:-true}'
            AGENT_SIMULATION_CHUNK_DELAY_MS: '${AGENT_SIMULATION_CHUNK_DELAY_MS:-35}'
            # Encrypts stored provider sign-ins; without it the sign-in endpoints stay closed (503).
            AGENT_CREDENTIAL_KEY: '${AGENT_CREDENTIAL_KEY:-}'
            AGENT_DATA_DIR: /var/lib/agent
            # Pi's sign-in callback listener must accept the published port below.
            PI_OAUTH_CALLBACK_HOST: 0.0.0.0
            # Optional OpenAI-compatible local model server (Ollama, LM Studio, llama.cpp, vLLM).
            # Set by the administrator only; users cannot point the engine at other addresses.
            LOCAL_LLM_URL: '${LOCAL_LLM_URL:-}'
            LOCAL_LLM_NAME: '${LOCAL_LLM_NAME:-}'
            LOCAL_LLM_API_KEY: '${LOCAL_LLM_API_KEY:-}'
        # Lets the engine reach a model server on this computer as host.docker.internal on any
        # Docker host (Docker Desktop provides the name already; Linux needs this mapping).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '3101'
        ports:
            # Only the provider's sign-in redirect, http://127.0.0.1:1455/auth/callback, on this
            # machine's loopback. The provider fixes the port; the listener runs only during a sign-in.
            - '127.0.0.1:1455:1455'
        volumes:
            - './agent-service/src:/app/src:ro'
            - './agent-service/tests:/app/tests:ro'
            - './contracts:/contracts:ro'
            # Private engine state: installation ID and encrypted sign-ins. Never mount it elsewhere.
            - agent-data:/var/lib/agent
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3101/internal/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 15s

    mysql:
        image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}'
            MYSQL_DATABASE: '${DB_DATABASE:-assistant_foundation}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=tcp --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent'
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

networks:
    sail:
        driver: bridge

volumes:
    mysql-data:
    agent-data:

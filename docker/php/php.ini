memory_limit=512M
upload_max_filesize=20M
post_max_size=20M
variables_order=EGPCS
; PHP's built-in development server runs as the CLI SAPI, where OPcache is off by default; without
; it every request re-reads the framework from the Windows bind mount (about 4 s per request).
; Timestamps are checked on every request, so code changes still apply immediately.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

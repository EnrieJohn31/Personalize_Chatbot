memory_limit=512M
upload_max_filesize=20M
post_max_size=20M
variables_order=EGPCS
; PHP's built-in development server runs as the CLI SAPI, where OPcache is off by default; without
; it every request re-reads the framework from the Windows bind mount (2-5 s per request).
; Timestamps are rechecked at most every 2 seconds: checking them on every request costs about as
; much on the bind mount as having no cache. Code changes apply within 2 seconds.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
